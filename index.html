<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Catalogue">
<title>Catalogue Camera</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --muted: #8e8e93;
    --line: #d1d1d6;
    --accent: #007aff;
    --danger: #ff3b30;
    --slot: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #f2f2f7;
      --muted: #8e8e93;
      --line: #38383a;
      --slot: #2c2c2e;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 20px; }
  button { font: inherit; border: 0; cursor: pointer; }
  .link-btn { background: none; color: var(--accent); padding: 6px 4px; }
  .search { margin: 12px 16px 0; }
  .search input { width: 100%; }
  input[type=text], select {
    font-size: 16px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
  }
  .group { margin: 16px 16px 0; }
  .group-head {
    display: flex; justify-content: space-between; align-items: center;
    width: 100%; background: none; color: var(--text);
    padding: 6px 4px; font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .3px;
  }
  .group-head .count { color: var(--muted); font-weight: 400; }
  .group.collapsed .items { display: none; }
  .group-head .chev { transition: transform .2s; display: inline-block; margin-right: 6px; }
  .group.collapsed .chev { transform: rotate(-90deg); }
  .items { background: var(--card); border-radius: 12px; overflow: hidden; }
  .item { padding: 12px; border-top: 1px solid var(--line); }
  .item:first-child { border-top: 0; }
  .item-info { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px; }
  .item-info dt { color: var(--muted); }
  .item-info dd { margin: 0; word-break: break-word; }
  .item-info dd.pn { font-weight: 600; }
  .views { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .view { text-align: center; font-size: 11px; color: var(--muted); }
  .thumb {
    width: 100%; aspect-ratio: 1; border-radius: 8px; background: var(--slot);
    object-fit: cover; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 20px; margin-bottom: 3px;
  }
  .item-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 24px; }
  .fab {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(20px + env(safe-area-inset-bottom));
    background: var(--accent); color: #fff; font-weight: 600;
    padding: 14px 28px; border-radius: 30px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .overlay {
    position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.open { display: flex; }
  .sheet {
    width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto;
    background: var(--bg); border-radius: 16px 16px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .sheet h2 { margin: 0 0 12px; font-size: 18px; text-align: center; }
  .field { display: block; margin-bottom: 10px; }
  .field span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select { width: 100%; }
  .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
  .slot { position: relative; background: none; padding: 0; color: var(--muted); font-size: 12px; text-align: center; }
  .slot .thumb { border: 2px dashed var(--line); }
  .slot img.thumb { border: 0; }
  .slot .remove {
    position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--danger); color: #fff; font-size: 14px; line-height: 24px; padding: 0;
  }
  .row { display: flex; gap: 8px; }
  .btn { flex: 1; padding: 13px; border-radius: 12px; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.secondary { background: var(--card); color: var(--accent); }
  .btn.danger { background: none; color: var(--danger); margin-top: 8px; width: 100%; }
  .btn:disabled { opacity: .45; }
  .menu-list button {
    display: block; width: 100%; text-align: left; padding: 14px 16px;
    background: var(--card); color: var(--accent); border-top: 1px solid var(--line);
  }
  .menu-list { border-radius: 12px; overflow: hidden; margin-bottom: 10px; }
  .menu-list button:first-child { border-top: 0; }
  .menu-list button.danger { color: var(--danger); }
  .viewer { position: fixed; inset: 0; z-index: 30; background: #000; display: none; align-items: center; justify-content: center; }
  .viewer.open { display: flex; }
  .viewer img { max-width: 100%; max-height: 100%; }
  .viewer .caption { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; }
  .toast {
    position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: rgba(0,0,0,.8); color: #fff; padding: 8px 16px; border-radius: 20px; font-size: 14px;
    z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <h1>Catalogue</h1>
  <button class="link-btn" id="menuBtn">Menu</button>
</header>

<div class="search"><input type="text" id="search" placeholder="Search part no., name, brand…" autocomplete="off"></div>
<main id="list"></main>

<button class="fab" id="newBtn">📷 New Item</button>

<div class="overlay" id="formOverlay">
  <form class="sheet" id="itemForm" autocomplete="off">
    <h2 id="formTitle">New Item</h2>
    <label class="field"><span>Group</span><select id="groupSelect"></select></label>
    <label class="field hidden" id="newGroupField"><span>New Group Name</span><input type="text" name="group"></label>
    <label class="field"><span>Part Number *</span><input type="text" name="partNo" required autocapitalize="characters"></label>
    <label class="field"><span>Name *</span><input type="text" name="name" required></label>
    <label class="field"><span>Brand</span><input type="text" name="brand" list="brandList"></label>
    <datalist id="brandList"></datalist>
    <div class="slots" id="slots"></div>
    <div class="row">
      <button type="button" class="btn secondary" id="cancelBtn">Cancel</button>
      <button type="button" class="btn secondary" id="cameraBtn">📷 Camera</button>
      <button type="submit" class="btn primary">Save</button>
    </div>
    <button type="button" class="btn danger hidden" id="deleteBtn">Delete Item</button>
  </form>
</div>

<div class="overlay" id="menuOverlay">
  <div class="sheet">
    <div class="menu-list">
      <button id="exportHtmlBtn">Export HTML Catalogue</button>
      <button id="exportJsonBtn">Export JSON Backup</button>
      <button id="importJsonBtn">Import JSON Backup</button>
      <button id="deleteAllBtn" class="danger">Delete All Items</button>
    </div>
    <button class="btn secondary" style="width:100%" id="menuCloseBtn">Close</button>
  </div>
</div>

<div class="viewer" id="viewer"><div class="caption" id="viewerCaption"></div><img id="viewerImg" alt=""></div>
<div class="toast" id="toast"></div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="importInput" accept="application/json,.json" class="hidden">

<script>
const VIEW_LABELS = ["First View", "Second View", "Third View"];
const MAX_PHOTOS = 3;
const MAX_IMAGE_SIZE = 1600;
const UNGROUPED = "Ungrouped";
const NEW_GROUP = "__new__";
const LAST_GROUP_KEY = "lastGroup";

const $ = (id) => document.getElementById(id);

const db = (() => {
  const open = new Promise((resolve, reject) => {
    const request = indexedDB.open("catalogue-camera", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("items", { keyPath: "id" });
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
  const run = async (mode, action) => {
    const database = await open;
    return new Promise((resolve, reject) => {
      const tx = database.transaction("items", mode);
      const request = action(tx.objectStore("items"));
      tx.oncomplete = () => resolve(request?.result);
      tx.onerror = () => reject(tx.error);
    });
  };
  return {
    all: () => run("readonly", (store) => store.getAll()),
    put: (item) => run("readwrite", (store) => store.put(item)),
    remove: (id) => run("readwrite", (store) => store.delete(id)),
    clear: () => run("readwrite", (store) => store.clear()),
  };
})();

let items = [];
let collapsedGroups = new Set();
let objectUrls = [];
let draft = null;
let pendingSlot = 0;

function escapeHtml(text) {
  return String(text ?? "").replace(/[&<>"']/g, (char) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]
  ));
}

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 1800);
}

function trackUrl(blob) {
  const url = URL.createObjectURL(blob);
  objectUrls.push(url);
  return url;
}

function groupItems(list) {
  const groups = new Map();
  for (const item of list) {
    const key = item.group?.trim() || UNGROUPED;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(item);
  }
  const sorted = [...groups.entries()].sort(([a], [b]) => a.localeCompare(b));
  for (const [, groupList] of sorted) {
    groupList.sort((a, b) => a.partNo.localeCompare(b.partNo, undefined, { numeric: true }));
  }
  return sorted;
}

function matchesSearch(item, query) {
  if (!query) return true;
  return [item.partNo, item.name, item.brand, item.group].some((value) => value?.toLowerCase().includes(query));
}

function renderList() {
  objectUrls.forEach(URL.revokeObjectURL);
  objectUrls = [];
  const query = $("search").value.trim().toLowerCase();
  const visible = items.filter((item) => matchesSearch(item, query));
  const list = $("list");

  if (!visible.length) {
    list.innerHTML = `<div class="empty">${items.length ? "No matching items." : "No items yet.<br>Tap “📷 New Item” to start."}</div>`;
    return;
  }

  list.innerHTML = groupItems(visible).map(([groupName, groupList]) => `
    <section class="group ${collapsedGroups.has(groupName) ? "collapsed" : ""}" data-group="${escapeHtml(groupName)}">
      <button class="group-head"><span><span class="chev">▾</span>${escapeHtml(groupName)}</span><span class="count">${groupList.length}</span></button>
      <div class="items">
        ${groupList.map((item) => `
          <div class="item">
            <dl class="item-info">
              <dt>Part No.</dt><dd class="pn">${escapeHtml(item.partNo)}</dd>
              <dt>Name</dt><dd>${escapeHtml(item.name)}</dd>
              <dt>Brand</dt><dd>${escapeHtml(item.brand) || "—"}</dd>
            </dl>
            <div class="views">
              ${VIEW_LABELS.map((label, index) => {
                const photo = item.photos[index];
                const thumb = photo
                  ? `<img class="thumb" src="${trackUrl(photo)}" data-id="${item.id}" data-index="${index}" alt="${label}">`
                  : `<div class="thumb">—</div>`;
                return `<div class="view">${thumb}${label}</div>`;
              }).join("")}
            </div>
            <div class="item-actions"><button class="link-btn" data-edit="${item.id}">Edit</button></div>
          </div>`).join("")}
      </div>
    </section>`).join("");
}

function refreshDatalists() {
  const fill = (id, values) => {
    $(id).innerHTML = [...new Set(values.filter(Boolean))].sort()
      .map((value) => `<option value="${escapeHtml(value)}">`).join("");
  };
  fill("brandList", items.map((item) => item.brand));
}

function renderGroupSelect(selected) {
  const groups = [...new Set([...items.map((item) => item.group), selected].filter(Boolean))].sort();
  const select = $("groupSelect");
  select.innerHTML = [
    `<option value="">— No Group —</option>`,
    ...groups.map((group) => `<option value="${escapeHtml(group)}">${escapeHtml(group)}</option>`),
    `<option value="${NEW_GROUP}">+ New Group…</option>`,
  ].join("");
  select.value = selected;
  $("itemForm").elements.group.value = selected;
  $("newGroupField").classList.add("hidden");
}

async function loadItems() {
  items = await db.all();
  refreshDatalists();
  renderList();
}

function renderSlots() {
  $("slots").innerHTML = VIEW_LABELS.map((label, index) => {
    const photo = draft.photos[index];
    const content = photo
      ? `<img class="thumb" src="${trackUrl(photo)}" alt=""><span class="remove" data-remove="${index}">×</span>`
      : `<div class="thumb">📷</div>`;
    return `<button type="button" class="slot" data-slot="${index}">${content}${label}</button>`;
  }).join("");
  const nextSlot = draft.photos.findIndex((photo) => !photo);
  const camera = $("cameraBtn");
  camera.disabled = nextSlot === -1;
  camera.textContent = nextSlot === -1 ? "3/3 ✓" : `📷 ${nextSlot + 1}/${MAX_PHOTOS}`;
}

function openForm(item) {
  draft = item
    ? { ...item, photos: [...item.photos] }
    : { id: crypto.randomUUID(), partNo: "", name: "", brand: "", group: localStorage.getItem(LAST_GROUP_KEY) ?? "", photos: [null, null, null], createdAt: Date.now() };
  const form = $("itemForm");
  for (const field of ["partNo", "name", "brand"]) form.elements[field].value = draft[field];
  renderGroupSelect(draft.group);
  $("formTitle").textContent = item ? "Edit Item" : "New Item";
  $("deleteBtn").classList.toggle("hidden", !item);
  renderSlots();
  $("formOverlay").classList.add("open");
  if (!item) form.elements.partNo.focus();
}

function closeForm() {
  $("formOverlay").classList.remove("open");
  draft = null;
  renderList();
}

function readFormFields() {
  const form = $("itemForm");
  for (const field of ["partNo", "name", "brand", "group"]) draft[field] = form.elements[field].value.trim();
}

function openCamera(slot) {
  const form = $("itemForm");
  if (!form.reportValidity()) return;
  readFormFields();
  pendingSlot = slot;
  $("cameraInput").click();
}

async function compressImage(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, MAX_IMAGE_SIZE / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.82));
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function dataUrlToBlob(dataUrl) {
  const response = await fetch(dataUrl);
  return response.blob();
}

async function shareOrDownload(content, filename, mimeType) {
  const file = new File([content], filename, { type: mimeType });
  if (navigator.canShare?.({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: filename });
      return;
    } catch (error) {
      if (error.name === "AbortError") return;
    }
  }
  const link = document.createElement("a");
  link.href = URL.createObjectURL(file);
  link.download = filename;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 10000);
}

function todayStamp() {
  return new Date().toISOString().slice(0, 10);
}

async function itemsWithDataUrls() {
  return Promise.all(items.map(async (item) => ({
    ...item,
    photos: await Promise.all(item.photos.map((photo) => (photo ? blobToDataUrl(photo) : null))),
  })));
}

async function exportJson() {
  const payload = { app: "catalogue-camera", version: 1, exportedAt: new Date().toISOString(), items: await itemsWithDataUrls() };
  await shareOrDownload(JSON.stringify(payload), `catalogue-backup-${todayStamp()}.json`, "application/json");
}

async function importJson(file) {
  const payload = JSON.parse(await file.text());
  if (!Array.isArray(payload.items)) throw new Error("Invalid backup file");
  for (const item of payload.items) {
    const photos = await Promise.all(
      Array.from({ length: MAX_PHOTOS }, (_, index) => (item.photos?.[index] ? dataUrlToBlob(item.photos[index]) : null)),
    );
    await db.put({ ...item, photos });
  }
  await loadItems();
  showToast(`Imported ${payload.items.length} items`);
}

async function exportHtml() {
  const exportItems = await itemsWithDataUrls();
  const sections = groupItems(exportItems).map(([groupName, groupList]) => `
<h2>${escapeHtml(groupName)} <small>(${groupList.length})</small></h2>
<table>
<thead><tr><th>Part No.</th><th>Name</th><th>Brand</th>${VIEW_LABELS.map((label) => `<th>${label}</th>`).join("")}</tr></thead>
<tbody>
${groupList.map((item) => `<tr>
<td><b>${escapeHtml(item.partNo)}</b></td><td>${escapeHtml(item.name)}</td><td>${escapeHtml(item.brand)}</td>
${item.photos.map((photo) => `<td class="img">${photo ? `<a href="${photo}" target="_blank"><img src="${photo}" alt=""></a>` : "—"}</td>`).join("")}
</tr>`).join("\n")}
</tbody>
</table>`).join("\n");

  const html = `<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalogue ${todayStamp()}</title>
<style>
body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:24px;color:#1c1c1e}
h1{margin:0 0 4px}h2{margin:28px 0 8px;border-bottom:2px solid #007aff;padding-bottom:4px}
h2 small{color:#8e8e93;font-weight:400}
table{width:100%;border-collapse:collapse;page-break-inside:auto}
tr{page-break-inside:avoid}
th,td{border:1px solid #d1d1d6;padding:6px;text-align:left;vertical-align:middle}
th{background:#f2f2f7}
td.img{width:130px;text-align:center}
td.img img{width:120px;height:120px;object-fit:cover;border-radius:6px;display:block;margin:auto}
</style></head><body>
<h1>Catalogue</h1><p style="color:#8e8e93">Exported ${new Date().toLocaleString()} · ${exportItems.length} items</p>
${sections}
</body></html>`;
  await shareOrDownload(html, `catalogue-${todayStamp()}.html`, "text/html");
}

function closeMenu() {
  $("menuOverlay").classList.remove("open");
}

async function runMenuAction(action, busyMessage) {
  closeMenu();
  if (!items.length) {
    showToast("Nothing to export");
    return;
  }
  showToast(busyMessage);
  try {
    await action();
  } catch (error) {
    showToast(`Failed: ${error.message}`);
  }
}

$("newBtn").addEventListener("click", () => openForm(null));
$("cancelBtn").addEventListener("click", closeForm);
$("search").addEventListener("input", renderList);

$("groupSelect").addEventListener("change", (event) => {
  const isNew = event.target.value === NEW_GROUP;
  const input = $("itemForm").elements.group;
  input.value = isNew ? "" : event.target.value;
  $("newGroupField").classList.toggle("hidden", !isNew);
  if (isNew) input.focus();
});

$("cameraBtn").addEventListener("click", () => {
  const nextSlot = draft.photos.findIndex((photo) => !photo);
  if (nextSlot !== -1) openCamera(nextSlot);
});

$("slots").addEventListener("click", (event) => {
  const removeIndex = event.target.dataset.remove;
  if (removeIndex !== undefined) {
    event.stopPropagation();
    draft.photos[Number(removeIndex)] = null;
    renderSlots();
    return;
  }
  const slot = event.target.closest("[data-slot]");
  if (slot) openCamera(Number(slot.dataset.slot));
});

$("cameraInput").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file || !draft) return;
  draft.photos[pendingSlot] = await compressImage(file);
  renderSlots();
});

$("itemForm").addEventListener("submit", async (event) => {
  event.preventDefault();
  readFormFields();
  draft.updatedAt = Date.now();
  await db.put(draft);
  localStorage.setItem(LAST_GROUP_KEY, draft.group);
  closeForm();
  await loadItems();
  showToast("Saved");
});

$("deleteBtn").addEventListener("click", async () => {
  if (!confirm(`Delete ${draft.partNo}?`)) return;
  await db.remove(draft.id);
  closeForm();
  await loadItems();
  showToast("Deleted");
});

$("list").addEventListener("click", (event) => {
  const head = event.target.closest(".group-head");
  if (head) {
    const section = head.closest(".group");
    const name = section.dataset.group;
    collapsedGroups.has(name) ? collapsedGroups.delete(name) : collapsedGroups.add(name);
    section.classList.toggle("collapsed");
    return;
  }
  const editId = event.target.dataset.edit;
  if (editId) {
    openForm(items.find((item) => item.id === editId));
    return;
  }
  const thumb = event.target.closest("img.thumb");
  if (thumb) {
    const item = items.find((entry) => entry.id === thumb.dataset.id);
    $("viewerImg").src = thumb.src;
    $("viewerCaption").textContent = `${item.partNo} · ${VIEW_LABELS[thumb.dataset.index]}`;
    $("viewer").classList.add("open");
  }
});

$("viewer").addEventListener("click", () => $("viewer").classList.remove("open"));

$("menuBtn").addEventListener("click", () => $("menuOverlay").classList.add("open"));
$("menuCloseBtn").addEventListener("click", closeMenu);
$("menuOverlay").addEventListener("click", (event) => { if (event.target.id === "menuOverlay") closeMenu(); });
$("exportHtmlBtn").addEventListener("click", () => runMenuAction(exportHtml, "Preparing HTML…"));
$("exportJsonBtn").addEventListener("click", () => runMenuAction(exportJson, "Preparing backup…"));
$("importJsonBtn").addEventListener("click", () => { closeMenu(); $("importInput").click(); });

$("deleteAllBtn").addEventListener("click", async () => {
  closeMenu();
  if (!items.length) {
    showToast("Nothing to delete");
    return;
  }
  if (!confirm(`Delete all ${items.length} items? Export a JSON backup first if you need it.`)) return;
  if (!confirm("This cannot be undone. Really delete everything?")) return;
  await db.clear();
  await loadItems();
  showToast("All items deleted");
});

$("importInput").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file) return;
  try {
    await importJson(file);
  } catch (error) {
    showToast(`Import failed: ${error.message}`);
  }
});

navigator.storage?.persist?.();
loadItems();
</script>
</body>
</html>
